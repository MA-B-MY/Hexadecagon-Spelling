<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary - Spell Runner</title>
    <link rel="stylesheet" href="dictionary.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Game</a>
        <h1>Word Library</h1>

        <input type="text" id="searchInput" placeholder="Search for a specific word...">

        <div class="alphabet-container" id="alphabetContainer">
            <!-- A-Z buttons will be generated by JavaScript here -->
        </div>
        <button id="resetBtn" class="reset-btn">Show All Words</button>

        <div class="word-grid" id="wordGrid">
            <!-- Words will appear here -->
        </div>
    </div>
    
    <script src="dictionary.js"></script>
</body>
</html>
